<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agendar Cita — ID Lillo SpA</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#1C2D4A;--navy2:#243860;--gold:#C5980A;
  --gold-light:#FEF7E0;--white:#FFFFFF;--bg:#F4F6F9;
  --border:#DDE3ED;--text:#1a1a2e;--muted:#6b7a99;
  --success:#166534;--success-bg:#dcfce7;--radius:14px;
}
body{font-family:'Barlow',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
header{width:100%;background:var(--navy);padding:18px 24px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;}
header::after{content:'';position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(197,152,10,0.12);}
header img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;position:relative;z-index:1;}
.header-text{position:relative;z-index:1;}
.header-text h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--white);letter-spacing:0.5px;line-height:1.1;}
.header-text span{font-size:11px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;}
main{width:100%;max-width:480px;padding:24px 16px 40px;}
.card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:24px 22px;margin-bottom:16px;box-shadow:0 2px 12px rgba(28,45,74,0.07);}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--navy);letter-spacing:0.3px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.card-title::before{content:'';width:4px;height:18px;background:var(--gold);border-radius:2px;flex-shrink:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:6px;}
input[type=date],input[type=time],input[type=text],textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Barlow',sans-serif;font-size:14px;color:var(--text);background:#fff;outline:none;transition:border-color .2s;-webkit-appearance:none;}
input:focus,textarea:focus{border-color:var(--navy);}
textarea{resize:vertical;min-height:90px;line-height:1.5;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;}
.divider span{font-size:12px;color:var(--muted);white-space:nowrap;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border:none;border-radius:10px;cursor:pointer;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.2px;transition:transform .15s,opacity .15s;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-mail{background:var(--navy);color:#fff;}
.btn-mail:hover:not(:disabled){background:var(--navy2);}
.btn-wa{background:#1A6B3C;color:#fff;}
.btn-wa:hover:not(:disabled){background:#145c32;}
.btn svg{width:18px;height:18px;flex-shrink:0;}
.alert{display:none;margin-top:14px;padding:12px 16px;border-radius:10px;background:var(--success-bg);border:1px solid #86efac;font-size:13px;color:var(--success);font-weight:500;}
.alert.show{display:block;}
.alert-err{display:none;margin-top:14px;padding:12px 16px;border-radius:10px;background:#fef2f2;border:1px solid #fca5a5;font-size:13px;color:#991b1b;font-weight:500;}
.alert-err.show{display:block;}
footer{text-align:center;padding:20px 16px;font-size:11px;color:var(--muted);line-height:1.6;}
footer a{color:var(--gold);text-decoration:none;}
@media(max-width:360px){.row2{grid-template-columns:1fr;}.btn-grid{grid-template-columns:1fr;}}
</style>
</head>

<script>
// ⚠️ REEMPLAZA esta URL con la URL de tu servicio en Render una vez desplegado
const API_URL = 'https://idlillo-agenda.onrender.com/enviar-cita';

function getVal(id){return document.getElementById(id).value.trim();}
function formatFecha(f){if(!f)return'';const[y,m,d]=f.split('-');return d+'/'+m+'/'+y;}

function mostrarOk(msg){
  const el=document.getElementById('alerta');
  el.textContent=msg;el.classList.add('show');
  document.getElementById('alerta-err').classList.remove('show');
  setTimeout(()=>el.classList.remove('show'),6000);
}
function mostrarErr(msg){
  const el=document.getElementById('alerta-err');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),5000);
}
function validar(){
  const d={fecha:getVal('fecha'),hora:getVal('hora'),nombre:getVal('nombre'),cita:getVal('cita')};
  if(!d.fecha||!d.hora||!d.nombre||!d.cita){
    mostrarErr('⚠️ Por favor completa todos los campos antes de continuar.');
    return null;
  }
  return d;
}

async function enviarCorreo(){
  const d=validar(); if(!d)return;
  const btn=document.getElementById('btn-correo');
  btn.disabled=true; btn.textContent='Enviando...';
  try{
    const r=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({nombre:d.nombre,fecha:formatFecha(d.fecha),hora:d.hora,motivo:d.cita})
    });
    const data=await r.json();
    if(data.ok){
      mostrarOk('✅ ¡Solicitud enviada! Recibirás confirmación a la brevedad.');
      document.getElementById('fecha').value='';
      document.getElementById('hora').value='';
      document.getElementById('nombre').value='';
      document.getElementById('cita').value='';
    } else {
      mostrarErr('❌ Error al enviar: '+data.error);
    }
  }catch(e){
    mostrarErr('❌ No se pudo conectar con el servidor. Intenta nuevamente.');
  }
  btn.disabled=false; btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg> Enviar correo';
}

function enviarWhatsApp(){
  const d=validar(); if(!d)return;
  const msg=encodeURIComponent(
    'Hola ID Lillo SpA 👋\n\nQuisiera agendar una cita:\n\n'+
    '📅 *Fecha:* '+formatFecha(d.fecha)+'\n'+
    '⏰ *Hora:* '+d.hora+'\n'+
    '👤 *Nombre:* '+d.nombre+'\n'+
    '📝 *Motivo:* '+d.cita+'\n\n'+
    '¿Está disponible ese horario? Muchas gracias.'
  );
  window.open('https://wa.me/56942322193?text='+msg,'_blank');
  mostrarOk('✅ Se abrió WhatsApp con tu solicitud lista para enviar.');
}
</script>
